# Integracao com Azure Key Vault via Secrets Store CSI Driver e a identidade
# gerenciada criada pelo add-on key_vault_secrets_provider do AKS.
# Substitua os placeholders na etapa de seguranca do AKS.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: azure-shop-kv
  namespace: azure-shop
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    clientID: "WORKLOAD_IDENTITY_CLIENT_ID"
    keyvaultName: "KEY_VAULT_NAME"
    tenantId: "TENANT_ID"
    objects: |
      array:
        - |
          objectName: sql-server
          objectType: secret
        - |
          objectName: sql-database
          objectType: secret
        - |
          objectName: sql-user
          objectType: secret
        - |
          objectName: sql-password
          objectType: secret
  # Opcional: sincroniza os segredos para um Secret Kubernetes consumivel por env.
  secretObjects:
    - secretName: azure-shop-secrets
      type: Opaque
      data:
        - objectName: sql-server
          key: sql-server
        - objectName: sql-database
          key: sql-database
        - objectName: sql-user
          key: sql-user
        - objectName: sql-password
          key: sql-password
