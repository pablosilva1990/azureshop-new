# Pipeline unica: da o "azd devops" ao Azure. Rodar esta pipeline do zero cria
# toda a infraestrutura (RG, ACR, App Service, Azure SQL, Key Vault, App
# Insights) via Terraform, builda a imagem no ACR e publica no App Service.
#
# Pre-requisitos no Azure DevOps (uma unica vez, feitos por quem administra o
# projeto, fora desta pipeline):
#   1. Criar um Service Connection do tipo "Azure Resource Manager" chamado
#      'DEvops-Estudos', reaproveitando o App Registration/Service Principal
#      existente com esse nome. Ele precisa de Contributor + User Access
#      Administrator na assinatura (o Terraform cria role assignments para o
#      App Service acessar ACR/Key Vault).
#   2. Instalar a extensao gratuita "Terraform" (autor: Microsoft DevOps
#      Labs / charleszipp) no Marketplace do Azure DevOps, se ainda nao estiver.
#   3. Ajustar as variaveis abaixo (suffix, location) se necessario.
#
# Depois disso, um unico "run" desta pipeline cria tudo.

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - src/*
      - public/*
      - infra/terraform/appservice/*
      - Dockerfile
      - package.json
      - azure-pipelines.yml

pr: none

pool:
  vmImage: ubuntu-latest

variables:
  # Service Connection (ARM) do projeto, ligado ao Service Principal existente 'DEvops-Estudos'.
  azureServiceConnection: 'DEvops-Estudos'

  # Sufixo curto e unico usado nos nomes globais (ACR, SQL, Key Vault, App).
  suffix: 'shop01'
  location: 'brazilsouth'

  terraformWorkingDirectory: '$(System.DefaultWorkingDirectory)/infra/terraform/appservice'
  terraformVersion: '1.9.5'

  # Storage account de state, criada/reaproveitada no estagio Bootstrap.
  tfStateResourceGroup: 'rg-azureshop-tfstate'
  tfStateStorageAccount: 'sttfstate$(suffix)'
  tfStateContainer: 'tfstate'
  tfStateKey: 'azureshop-appservice.tfstate'

  dockerImageName: 'azureshop'

stages:
  - stage: Test
    displayName: 'Testes da aplicação'
    jobs:
      - job: RunTests
        displayName: 'npm ci && npm test'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '20.x'
          - script: |
              npm ci
              npm test
            displayName: 'Instalar dependências e rodar testes'

  - stage: Bootstrap
    displayName: 'Bootstrap do state remoto'
    dependsOn: Test
    jobs:
      - job: EnsureStateStorage
        displayName: 'Garantir RG/Storage Account para o tfstate'
        steps:
          - task: AzureCLI@2
            name: bootstrap
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                az group create \
                  --name "$(tfStateResourceGroup)" \
                  --location "$(location)" \
                  --tags project=azureshop managed=pipeline >/dev/null

                if ! az storage account show --name "$(tfStateStorageAccount)" --resource-group "$(tfStateResourceGroup)" >/dev/null 2>&1; then
                  az storage account create \
                    --name "$(tfStateStorageAccount)" \
                    --resource-group "$(tfStateResourceGroup)" \
                    --location "$(location)" \
                    --sku Standard_LRS \
                    --kind StorageV2 \
                    --min-tls-version TLS1_2 \
                    --allow-blob-public-access false >/dev/null
                fi

                az storage container create \
                  --name "$(tfStateContainer)" \
                  --account-name "$(tfStateStorageAccount)" \
                  --auth-mode login >/dev/null

  - stage: Infra
    displayName: 'Provisionar infraestrutura (Terraform)'
    dependsOn: Bootstrap
    jobs:
      - job: TerraformApply
        displayName: 'terraform init/validate/plan/apply'
        steps:
          - task: TerraformInstaller@1
            displayName: 'Instalar Terraform'
            inputs:
              terraformVersion: '$(terraformVersion)'

          - task: TerraformTaskV4@4
            displayName: 'terraform init'
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(terraformWorkingDirectory)'
              backendServiceArm: '$(azureServiceConnection)'
              backendAzureRmResourceGroupName: '$(tfStateResourceGroup)'
              backendAzureRmStorageAccountName: '$(tfStateStorageAccount)'
              backendAzureRmContainerName: '$(tfStateContainer)'
              backendAzureRmKey: '$(tfStateKey)'

          - task: TerraformTaskV4@4
            displayName: 'terraform validate'
            inputs:
              provider: 'azurerm'
              command: 'validate'
              workingDirectory: '$(terraformWorkingDirectory)'

          - task: AzureCLI@2
            name: resolveSp
            displayName: 'Resolver object id do SP DEvops-Estudos'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                objectId=$(az ad sp list --display-name "DEvops-Estudos" --query "[0].id" -o tsv)
                echo "##vso[task.setvariable variable=objectId]$objectId"

          - task: TerraformTaskV4@4
            displayName: 'terraform plan'
            inputs:
              provider: 'azurerm'
              command: 'plan'
              workingDirectory: '$(terraformWorkingDirectory)'
              environmentServiceNameAzureRM: '$(azureServiceConnection)'
              commandOptions: '-var="suffix=$(suffix)" -var="location=$(location)" -var="pipeline_service_principal_object_id=$(objectId)" -out=tfplan'
            env:
              TF_VAR_docker_image_name: '$(dockerImageName)'

          - task: TerraformTaskV4@4
            displayName: 'terraform apply'
            inputs:
              provider: 'azurerm'
              command: 'apply'
              workingDirectory: '$(terraformWorkingDirectory)'
              environmentServiceNameAzureRM: '$(azureServiceConnection)'
              commandOptions: 'tfplan'

          - bash: |
              set -euo pipefail
              cd "$(terraformWorkingDirectory)"
              echo "##vso[task.setvariable variable=acrName;isOutput=true]$(terraform output -raw acr_name)"
              echo "##vso[task.setvariable variable=acrLoginServer;isOutput=true]$(terraform output -raw acr_login_server)"
              echo "##vso[task.setvariable variable=appServiceName;isOutput=true]$(terraform output -raw app_service_name)"
              echo "##vso[task.setvariable variable=resourceGroupName;isOutput=true]$(terraform output -raw resource_group_name)"
              echo "##vso[task.setvariable variable=appServiceUrl;isOutput=true]$(terraform output -raw app_service_url)"
            name: tfOutputs
            displayName: 'Publicar outputs do Terraform'

  - stage: BuildAndPush
    displayName: 'Build da imagem (ACR Tasks)'
    dependsOn: Infra
    variables:
      acrName: $[ stageDependencies.Infra.TerraformApply.outputs['tfOutputs.acrName'] ]
    jobs:
      - job: AcrBuild
        displayName: 'az acr build'
        steps:
          - task: AzureCLI@2
            name: acrBuild
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                az acr build \
                  --registry "$(acrName)" \
                  --image "$(dockerImageName):$(Build.BuildId)" \
                  --file Dockerfile \
                  .

  - stage: Deploy
    displayName: 'Deploy no App Service'
    dependsOn:
      - Infra
      - BuildAndPush
    variables:
      acrLoginServer: $[ stageDependencies.Infra.TerraformApply.outputs['tfOutputs.acrLoginServer'] ]
      appServiceName: $[ stageDependencies.Infra.TerraformApply.outputs['tfOutputs.appServiceName'] ]
      resourceGroupName: $[ stageDependencies.Infra.TerraformApply.outputs['tfOutputs.resourceGroupName'] ]
      appServiceUrl: $[ stageDependencies.Infra.TerraformApply.outputs['tfOutputs.appServiceUrl'] ]
    jobs:
      - job: UpdateContainer
        displayName: 'Atualizar imagem do container e reiniciar'
        steps:
          - task: AzureCLI@2
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                az webapp config container set \
                  --name "$(appServiceName)" \
                  --resource-group "$(resourceGroupName)" \
                  --container-image-name "$(acrLoginServer)/$(dockerImageName):$(Build.BuildId)" \
                  --container-registry-url "https://$(acrLoginServer)"

                az webapp restart \
                  --name "$(appServiceName)" \
                  --resource-group "$(resourceGroupName)"

                echo "Aplicação publicada em: $(appServiceUrl)"
