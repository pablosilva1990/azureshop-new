# Pipeline separada para publicar a mesma aplicacao AzureShop em um AKS,
# rodando em PARALELO ao ambiente App Service (azure-pipelines.yml). Reaproveita
# o ACR, o Azure SQL e o Key Vault ja criados pelo stack App Service.
#
# Pre-requisitos no Azure DevOps (os mesmos da pipeline do App Service):
#   1. Service Connection 'DEvops-Estudos' (Azure Resource Manager) com
#      Contributor + User Access Administrator na assinatura.
#   2. Extensao "Terraform" (Microsoft DevOps Labs / charleszipp) instalada.
#   3. A pipeline do App Service (azure-pipelines.yml) ja deve ter rodado pelo
#      menos uma vez, pois este stack referencia (via data source) o ACR, o
#      Azure SQL e o Key Vault criados por ela.

trigger: none

pr: none

pool:
  vmImage: ubuntu-latest

variables:
  azureServiceConnection: 'DEvops-Estudos'

  # Sufixo curto usado nos nomes novos deste stack (RG, AKS, Log Analytics).
  suffix: 'aks01'
  location: 'westus3'

  # Recursos existentes (criados pelo stack App Service) reaproveitados aqui.
  sharedResourceGroupName: 'rg-azureshop-shop01'
  acrName: 'acrazureshopshop01'
  keyVaultName: 'kv-azshop2-shop01'

  # Azure SQL dedicado ao AKS (criado por este stack; o servidor do App Service foi excluido).
  sqlDatabaseName: 'azureshop'
  sqlAdminLogin: 'azureshopadmin'

  terraformWorkingDirectory: '$(System.DefaultWorkingDirectory)/infra/terraform/aks'
  terraformVersion: '1.9.5'

  # Mesma Storage Account de state do stack App Service, key de blob diferente.
  tfStateResourceGroup: 'rg-azureshop-tfstate'
  tfStateStorageAccount: 'sttfstateshop01'
  tfStateContainer: 'tfstate'
  tfStateKey: 'azureshop-aks.tfstate'

  dockerImageName: 'azureshop'
  k8sNamespace: 'azure-shop'

stages:
  - stage: Test
    displayName: 'Testes da aplicação'
    jobs:
      - job: RunTests
        displayName: 'npm ci && npm test'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '20.x'
          - script: |
              npm ci
              npm test
            displayName: 'Instalar dependências e rodar testes'

  - stage: Bootstrap
    displayName: 'Bootstrap do state remoto'
    dependsOn: Test
    jobs:
      - job: EnsureStateStorage
        displayName: 'Garantir RG/Storage Account para o tfstate'
        steps:
          - task: AzureCLI@2
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                az upgrade --yes --only-show-errors
                az group create \
                  --name "$(tfStateResourceGroup)" \
                  --location "$(location)" \
                  --tags project=azureshop managed=pipeline >/dev/null
                if ! az storage account show --name "$(tfStateStorageAccount)" --resource-group "$(tfStateResourceGroup)" >/dev/null 2>&1; then
                  az storage account create \
                    --name "$(tfStateStorageAccount)" \
                    --resource-group "$(tfStateResourceGroup)" \
                    --location "$(location)" \
                    --sku Standard_LRS \
                    --kind StorageV2 \
                    --min-tls-version TLS1_2 \
                    --allow-blob-public-access false >/dev/null
                fi
                az storage container create \
                  --name "$(tfStateContainer)" \
                  --account-name "$(tfStateStorageAccount)" \
                  --auth-mode login >/dev/null

  - stage: Infra
    displayName: 'Provisionar AKS (Terraform)'
    dependsOn: Bootstrap
    jobs:
      - job: TerraformApply
        displayName: 'terraform init/validate/plan/apply'
        steps:
          - task: TerraformInstaller@1
            displayName: 'Instalar Terraform'
            inputs:
              terraformVersion: '$(terraformVersion)'

          - task: TerraformTaskV4@4
            displayName: 'terraform init'
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(terraformWorkingDirectory)'
              backendServiceArm: '$(azureServiceConnection)'
              backendAzureRmResourceGroupName: '$(tfStateResourceGroup)'
              backendAzureRmStorageAccountName: '$(tfStateStorageAccount)'
              backendAzureRmContainerName: '$(tfStateContainer)'
              backendAzureRmKey: '$(tfStateKey)'

          - task: TerraformTaskV4@4
            displayName: 'terraform validate'
            inputs:
              provider: 'azurerm'
              command: 'validate'
              workingDirectory: '$(terraformWorkingDirectory)'

          - task: TerraformTaskV4@4
            displayName: 'terraform plan'
            inputs:
              provider: 'azurerm'
              command: 'plan'
              workingDirectory: '$(terraformWorkingDirectory)'
              environmentServiceNameAzureRM: '$(azureServiceConnection)'
              commandOptions: >
                -var="suffix=$(suffix)"
                -var="location=$(location)"
                -var="shared_resource_group_name=$(sharedResourceGroupName)"
                -var="acr_name=$(acrName)"
                -var="sql_database_name=$(sqlDatabaseName)"
                -var="sql_admin_login=$(sqlAdminLogin)"
                -var="key_vault_name=$(keyVaultName)"
                -out=tfplan

          - task: TerraformTaskV4@4
            displayName: 'terraform apply'
            inputs:
              provider: 'azurerm'
              command: 'apply'
              workingDirectory: '$(terraformWorkingDirectory)'
              environmentServiceNameAzureRM: '$(azureServiceConnection)'
              commandOptions: 'tfplan'

          - task: AzureCLI@2
            name: tfOutputs
            displayName: 'Publicar outputs do Terraform e aplicar schema do Azure SQL'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                az upgrade --yes --only-show-errors
                cd "$(terraformWorkingDirectory)"

                aksName=$(terraform output -raw aks_name)
                aksResourceGroupName=$(terraform output -raw resource_group_name)
                acrLoginServer=$(terraform output -raw acr_login_server)
                keyVaultSecretsProviderClientId=$(terraform output -raw key_vault_secrets_provider_client_id)
                tenantId=$(terraform output -raw tenant_id)
                sqlServerFqdn=$(terraform output -raw sql_server_fqdn)
                sqlDatabaseNameOut=$(terraform output -raw sql_database_name)

                echo "##vso[task.setvariable variable=aksName;isOutput=true]$aksName"
                echo "##vso[task.setvariable variable=aksResourceGroupName;isOutput=true]$aksResourceGroupName"
                echo "##vso[task.setvariable variable=acrLoginServer;isOutput=true]$acrLoginServer"
                echo "##vso[task.setvariable variable=keyVaultSecretsProviderClientId;isOutput=true]$keyVaultSecretsProviderClientId"
                echo "##vso[task.setvariable variable=tenantId;isOutput=true]$tenantId"

                # Variaveis de shell locais (nao macros $(...) do Pipelines) evitam que o
                # bash tente executa-las como command substitution antes da expansao do Azure DevOps.
                if ! command -v sqlcmd >/dev/null 2>&1; then
                  curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
                  curl -fsSL https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list >/dev/null
                  sudo apt-get update -y
                  sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev
                fi
                export PATH="$PATH:/opt/mssql-tools18/bin"

                sqlPassword=$(az keyvault secret show --vault-name "$(keyVaultName)" --name sql-password --query value -o tsv)

                sqlcmd -S "$sqlServerFqdn" -d "$sqlDatabaseNameOut" -U "$(sqlAdminLogin)" -P "$sqlPassword" -C \
                  -i "$(System.DefaultWorkingDirectory)/infra/sql/schema.sql"

  - stage: BuildAndPush
    displayName: 'Build da imagem (ACR Tasks)'
    dependsOn: Infra
    jobs:
      - job: AcrBuild
        displayName: 'az acr build'
        steps:
          - task: AzureCLI@2
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                az upgrade --yes --only-show-errors
                az acr build \
                  --registry "$(acrName)" \
                  --image "$(dockerImageName):$(Build.BuildId)" \
                  --file Dockerfile \
                  .

  - stage: Deploy
    displayName: 'Deploy no AKS'
    dependsOn:
      - Infra
      - BuildAndPush
    variables:
      aksName: $[ stageDependencies.Infra.TerraformApply.outputs['tfOutputs.aksName'] ]
      aksResourceGroupName: $[ stageDependencies.Infra.TerraformApply.outputs['tfOutputs.aksResourceGroupName'] ]
      acrLoginServer: $[ stageDependencies.Infra.TerraformApply.outputs['tfOutputs.acrLoginServer'] ]
      keyVaultSecretsProviderClientId: $[ stageDependencies.Infra.TerraformApply.outputs['tfOutputs.keyVaultSecretsProviderClientId'] ]
      tenantId: $[ stageDependencies.Infra.TerraformApply.outputs['tfOutputs.tenantId'] ]
    jobs:
      - job: KubectlApply
        displayName: 'kubectl apply dos manifests'
        steps:
          - task: AzureCLI@2
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                az upgrade --yes --only-show-errors

                az aks install-cli --only-show-errors || true
                az aks get-credentials \
                  --resource-group "$(aksResourceGroupName)" \
                  --name "$(aksName)" \
                  --overwrite-existing

                manifestsDir="$(System.DefaultWorkingDirectory)/infra/k8s"
                workDir=$(mktemp -d)
                cp "$manifestsDir"/*.yaml "$workDir"/

                sed -i "s#ACR_NAME.azurecr.io#$(acrLoginServer)#g; s#azure-shop:IMAGE_TAG#$(dockerImageName):$(Build.BuildId)#g" "$workDir/deployment.yaml"
                sed -i "s#WORKLOAD_IDENTITY_CLIENT_ID#$(keyVaultSecretsProviderClientId)#g; s#KEY_VAULT_NAME#$(keyVaultName)#g; s#TENANT_ID#$(tenantId)#g" "$workDir/secretproviderclass.yaml"

                kubectl apply -f "$workDir/namespace.yaml"
                kubectl apply -f "$workDir/configmap.yaml"
                kubectl apply -f "$workDir/secretproviderclass.yaml"
                kubectl apply -f "$workDir/deployment.yaml"
                kubectl apply -f "$workDir/service.yaml"

                if ! kubectl -n "$(k8sNamespace)" rollout status deployment/azure-shop --timeout=180s; then
                  echo "Diagnostico do rollout do AzureShop"
                  kubectl -n "$(k8sNamespace)" get pods -o wide || true
                  kubectl -n "$(k8sNamespace)" describe deployment azure-shop || true
                  kubectl -n "$(k8sNamespace)" describe pods -l app=azure-shop || true
                  kubectl -n "$(k8sNamespace)" get events --sort-by=.lastTimestamp || true
                  kubectl -n "$(k8sNamespace)" logs -l app=azure-shop --all-containers --prefix --tail=200 || true
                  exit 1
                fi
                kubectl -n "$(k8sNamespace)" get service azure-shop
